[project]
name = "hayabusa-mcp"
version = "0.1.0"
description = "MCP server that wraps Hayabusa for Windows event log (EVTX) analysis"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
hayabusa-mcp = "hayabusa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hayabusa_mcp"]
