title: Test cases for credential_access_golden_ticket.yml
rule: 3de1d5df-4eb6-411e-962e-8a1731eff269
tests:
    - name: positive_null_logonguid_kerberos_logon
      description: Kerberos network logon carrying an all-zero LogonGuid, characteristic of a forged TGT.
      log:
          EventID: 4624
          LogonType: 3
          AuthenticationPackageName: 'Kerberos'
          LogonGuid: '00000000-0000-0000-0000-000000000000'
          TargetUserName: 'jdoe'
      expected_match: true

    - name: negative_machine_account_filtered
      description: Null LogonGuid but the target is a machine account, which is allow-listed.
      log:
          EventID: 4624
          LogonType: 3
          AuthenticationPackageName: 'Kerberos'
          LogonGuid: '00000000-0000-0000-0000-000000000000'
          TargetUserName: 'WORKSTATION01$'
      expected_match: false

    - name: negative_nonzero_logonguid
      description: Legitimately issued ticket carries a real LogonGuid and must not match.
      log:
          EventID: 4624
          LogonType: 3
          AuthenticationPackageName: 'Kerberos'
          LogonGuid: '3e1b4d2a-1234-4a5b-8c6d-9e0f12345678'
          TargetUserName: 'jdoe'
      expected_match: false

    - name: negative_ntlm_package
      description: NTLM (not Kerberos) authentication package must not match.
      log:
          EventID: 4624
          LogonType: 3
          AuthenticationPackageName: 'NTLM'
          LogonGuid: '00000000-0000-0000-0000-000000000000'
          TargetUserName: 'jdoe'
      expected_match: false
