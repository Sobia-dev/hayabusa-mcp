title: Test cases for credential_access_lsass_memory_dump.yml
rule: b19b1dae-f6e1-40e1-af06-544a79ecd702
tests:
    - name: positive_mimikatz_style_full_access
      description: Unknown process opens lsass.exe with the full-access mask Mimikatz requests.
      log:
          EventID: 10
          TargetImage: 'C:\Windows\System32\lsass.exe'
          GrantedAccess: '0x1fffff'
          SourceImage: 'C:\Users\Public\mimikatz.exe'
      expected_match: true

    - name: negative_known_tool_filtered
      description: Same access mask but from an allow-listed source image (Windows Defender).
      log:
          EventID: 10
          TargetImage: 'C:\Windows\System32\lsass.exe'
          GrantedAccess: '0x1fffff'
          SourceImage: 'C:\Program Files\Windows Defender\MsMpEng.exe'
      expected_match: false

    - name: negative_access_mask_not_listed
      description: GrantedAccess value outside the suspicious mask list must not match.
      log:
          EventID: 10
          TargetImage: 'C:\Windows\System32\lsass.exe'
          GrantedAccess: '0x1000'
          SourceImage: 'C:\Users\Public\tool.exe'
      expected_match: false

    - name: negative_wrong_target
      description: Suspicious access mask against a process other than lsass.exe must not match.
      log:
          EventID: 10
          TargetImage: 'C:\Windows\System32\notepad.exe'
          GrantedAccess: '0x1fffff'
          SourceImage: 'C:\Users\Public\tool.exe'
      expected_match: false
