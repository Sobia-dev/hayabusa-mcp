title: Potential Kerberoasting via RC4 Service Ticket Request
id: a5bf3cff-6ef1-47d5-8a4a-01f8d9e44a6a
status: stable
description: |
    Detects Kerberos service ticket requests (TGS-REQ) using the weak RC4-HMAC (0x17)
    encryption type for a non-machine service account, which is characteristic of
    Kerberoasting - requesting tickets offline-crackable for a service account's
    plaintext password.

    Severity is medium because the request alone confirms only that a ticket was
    selected for offline cracking, not that the crack succeeded - it warrants triage
    rather than the high/critical confidence of a rule confirming actual credential
    exposure.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_kerberoasting.yml
author: hayabusa-detection-kb
date: 2024-02-11
modified: 2024-09-01
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: windows
    service: security
    definition: 'Requires Directory Service Access Auditing on Domain Controllers, Event ID 4769'
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter_machine_accounts:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    filter_anonymous:
        TargetUserName: '*$'
    condition: selection and not 1 of filter_*
falsepositives:
    - Legacy applications or devices that only support RC4 Kerberos encryption
    - Service accounts intentionally configured without AES support
level: medium
