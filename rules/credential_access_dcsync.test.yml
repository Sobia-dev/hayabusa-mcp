title: Test cases for credential_access_dcsync.yml
rule: 9e749400-7b4c-46d9-9a7a-3316f6214aea
tests:
    - name: positive_replication_from_non_dc_account
      description: DS-Replication-Get-Changes-All requested by a regular user account.
      log:
          EventID: 4662
          Properties: 'Get-Changes-All {1131f6aa-9c07-11d1-f79f-00c04fc2dcd2}'
          SubjectUserName: 'jdoe'
      expected_match: true

    - name: negative_domain_controller_filtered
      description: Same replication GUID but the subject is a domain controller computer account.
      log:
          EventID: 4662
          Properties: 'Get-Changes-All {1131f6aa-9c07-11d1-f79f-00c04fc2dcd2}'
          SubjectUserName: 'DC01$'
      expected_match: false

    - name: negative_unrelated_property_guid
      description: Directory Service Access event for an unrelated property must not match.
      log:
          EventID: 4662
          Properties: 'Some-Other-Property {bf967950-0de6-11d0-a285-00aa003049e2}'
          SubjectUserName: 'jdoe'
      expected_match: false
