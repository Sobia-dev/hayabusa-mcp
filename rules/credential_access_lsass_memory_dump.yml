title: LSASS Memory Access via Suspicious GrantedAccess Mask
id: b19b1dae-f6e1-40e1-af06-544a79ecd702
status: stable
description: |
    Detects process access to lsass.exe with a GrantedAccess mask commonly requested
    by credential-dumping tools (e.g. Mimikatz, ProcDump used maliciously) rather than
    the narrow access legitimate processes request.

    Severity is high because these GrantedAccess masks grant memory-read rights
    sufficient for full credential extraction (e.g. Mimikatz sekurlsa::logonpasswords),
    a level of access legitimate processes rarely request against lsass.exe.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml
author: hayabusa-detection-kb
date: 2024-02-10
modified: 2024-09-01
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
    definition: 'Requires Sysmon Event ID 10 (ProcessAccess) with GrantedAccess visible'
detection:
    selection_target:
        TargetImage|endswith: '\lsass.exe'
    selection_access:
        GrantedAccess:
            - '0x1010'
            - '0x1038'
            - '0x1400'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter_main_known_tools:
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\dllhost.exe'
            - '\WmiPrvSE.exe'
            - '\svchost.exe'
    condition: selection_target and selection_access and not filter_main_known_tools
falsepositives:
    - Endpoint protection or EDR agents performing legitimate LSASS inspection
    - Backup or crash-dump utilities configured to include lsass.exe
level: high
