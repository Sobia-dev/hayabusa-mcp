title: NTDS.dit Extraction via ntdsutil Install-From-Media
id: 570632e2-6fd6-4e3f-bc81-f0ba11fbdb4c
status: stable
description: |
    Detects use of the built-in ntdsutil.exe utility to create an Install-From-Media
    (IFM) snapshot, which packages a copy of NTDS.dit plus the SYSTEM registry hive
    and is a common living-off-the-land technique for offline credential extraction
    from a domain controller.

    Severity is high because a completed IFM snapshot yields an offline copy of
    NTDS.dit plus the SYSTEM hive, enabling extraction of every domain credential
    without further live access - comparable in impact to DCSync but via a
    different vector.
references:
    - https://attack.mitre.org/techniques/T1003/003/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_ntdsutil_ifm.yml
author: hayabusa-detection-kb
date: 2024-02-14
modified: 2024-09-01
tags:
    - attack.credential-access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\ntdsutil.exe'
        - OriginalFileName: 'ntdsutil.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'ac i ntds'
            - 'ifm'
    condition: selection_img and selection_cli
falsepositives:
    - Authorized domain controller backup or migration procedures performed by AD administrators
level: high
