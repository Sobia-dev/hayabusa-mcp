title: Test cases for credential_access_kerberoasting.yml
rule: a5bf3cff-6ef1-47d5-8a4a-01f8d9e44a6a
tests:
    - name: positive_rc4_ticket_for_service_account
      description: TGS-REQ for a real (non-machine, non-krbtgt) service account using RC4.
      log:
          EventID: 4769
          TicketEncryptionType: '0x17'
          ServiceName: 'SQLService'
          TargetUserName: 'jdoe'
      expected_match: true

    - name: negative_machine_account_filtered
      description: RC4 ticket request for a machine account service name must not match.
      log:
          EventID: 4769
          TicketEncryptionType: '0x17'
          ServiceName: 'WORKSTATION01$'
          TargetUserName: 'jdoe'
      expected_match: false

    - name: negative_krbtgt_filtered
      description: RC4 ticket request for krbtgt itself must not match.
      log:
          EventID: 4769
          TicketEncryptionType: '0x17'
          ServiceName: 'krbtgt'
          TargetUserName: 'jdoe'
      expected_match: false

    - name: negative_aes_encryption
      description: Ticket requested with AES (not RC4) must not match.
      log:
          EventID: 4769
          TicketEncryptionType: '0x12'
          ServiceName: 'SQLService'
          TargetUserName: 'jdoe'
      expected_match: false
