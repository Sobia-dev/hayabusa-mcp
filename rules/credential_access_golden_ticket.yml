title: Potential Golden Ticket Usage via Null LogonGuid
id: 3de1d5df-4eb6-411e-962e-8a1731eff269
status: experimental
description: |
    Detects Kerberos network logons (LogonType 3) with an empty/null LogonGuid,
    a known artifact of forged Kerberos TGTs (Golden Tickets) created offline with
    tools like Mimikatz `kerberos::golden`, since legitimately issued tickets carry
    a LogonGuid correlating back to the originating TGT request.

    Severity is high because a Golden Ticket grants persistent, forgeable
    domain-admin-equivalent authentication that survives password resets and
    resists revocation short of a full krbtgt key rotation.
references:
    - https://attack.mitre.org/techniques/T1558/001/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_rc4_ticket.yml
author: hayabusa-detection-kb
date: 2024-02-15
modified: 2024-09-01
tags:
    - attack.credential-access
    - attack.t1558.001
logsource:
    product: windows
    service: security
    definition: 'Requires "Audit Logon" success auditing, Event ID 4624'
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'Kerberos'
        LogonGuid: '00000000-0000-0000-0000-000000000000'
    filter_local_service_accounts:
        TargetUserName|endswith: '$'
    condition: selection and not filter_local_service_accounts
falsepositives:
    - Certain constrained/S4U delegation scenarios that legitimately omit LogonGuid
    - Non-Windows Kerberos clients (e.g. Linux, network appliances) with incomplete ticket metadata
level: high
