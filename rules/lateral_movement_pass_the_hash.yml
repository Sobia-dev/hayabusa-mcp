title: Potential Pass-the-Hash via NTLM Logon with Empty Key Length
id: 12fa1530-030c-4359-8b9c-89565c6914ed
status: experimental
description: |
    Detects network logons (LogonType 3) using NTLM authentication where KeyLength
    is 0 and the logon process is NtLmSsp, a pattern commonly produced by
    Pass-the-Hash tooling that authenticates with a captured NTLM hash rather than
    an interactive password.

    Severity is medium because this shape alone is a necessary but not sufficient
    indicator of Pass-the-Hash - legitimate NTLM fallback traffic can share the same
    fields, so it warrants triage rather than an automatic high-confidence
    compromise verdict.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_logon_explicit_credentials.yml
author: hayabusa-detection-kb
date: 2024-02-13
modified: 2024-09-01
tags:
    - attack.lateral-movement
    - attack.defense-evasion
    - attack.t1550.002
logsource:
    product: windows
    service: security
    definition: 'Requires "Audit Logon" success auditing, Event ID 4624'
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
        LogonProcessName: 'NtLmSsp'
        KeyLength: 0
    filter_anonymous_logon:
        TargetUserName: 'ANONYMOUS LOGON'
    condition: selection and not filter_anonymous_logon
falsepositives:
    - Older applications or scripts that authenticate over NTLM without Kerberos available
    - Some non-Windows SMB clients (e.g. legacy NAS devices) using NTLM by default
level: medium
