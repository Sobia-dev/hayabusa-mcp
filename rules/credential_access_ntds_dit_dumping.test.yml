title: Test cases for credential_access_ntds_dit_dumping.yml
rule: 570632e2-6fd6-4e3f-bc81-f0ba11fbdb4c
tests:
    - name: positive_ntdsutil_ifm_snapshot
      description: ntdsutil.exe invoked with the IFM create-snapshot command sequence.
      log:
          Image: 'C:\Windows\System32\ntdsutil.exe'
          OriginalFileName: 'ntdsutil.exe'
          CommandLine: 'ntdsutil.exe "ac i ntds" "ifm" "create full c:\temp\ifm" q q'
      expected_match: true

    - name: negative_missing_ifm_argument
      description: ntdsutil.exe run for an unrelated maintenance command, no ifm/ac i ntds pair.
      log:
          Image: 'C:\Windows\System32\ntdsutil.exe'
          OriginalFileName: 'ntdsutil.exe'
          CommandLine: 'ntdsutil.exe "authoritative restore" q'
      expected_match: false

    - name: negative_wrong_image
      description: Matching command-line text run from a binary other than ntdsutil.exe must not match.
      log:
          Image: 'C:\Users\Public\renamed.exe'
          OriginalFileName: 'notntdsutil.exe'
          CommandLine: 'renamed.exe "ac i ntds" "ifm" "create full c:\temp\ifm" q q'
      expected_match: false
