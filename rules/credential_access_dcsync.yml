title: Active Directory Replication from Non-Domain-Controller (DCSync)
id: 9e749400-7b4c-46d9-9a7a-3316f6214aea
status: stable
description: |
    Detects directory replication requests (DS-Replication-Get-Changes /
    DS-Replication-Get-Changes-All) originating from a security principal other
    than a domain controller computer account, indicating credential dumping via
    DCSync (e.g. Mimikatz `lsadump::dcsync`, Impacket `secretsdump.py`).

    Severity is critical because a successful DCSync lets an attacker replicate every
    credential in the domain, including the krbtgt hash - a full domain-compromise
    primitive, not access limited to a single account.
references:
    - https://attack.mitre.org/techniques/T1003/006/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_dcsync.yml
author: hayabusa-detection-kb
date: 2024-02-12
modified: 2024-09-01
tags:
    - attack.credential-access
    - attack.t1003.006
logsource:
    product: windows
    service: security
    definition: 'Requires "Audit Directory Service Access" enabled on Domain Controllers, Event ID 4662'
detection:
    selection:
        EventID: 4662
        Properties|contains:
            - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
            - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
    filter_domain_controllers:
        SubjectUserName|endswith: '$'
    condition: selection and not filter_domain_controllers
falsepositives:
    - Legitimate Azure AD Connect / directory sync service accounts (should be allow-listed by SubjectUserName)
    - Third-party identity or backup solutions performing authorized AD replication
level: critical
